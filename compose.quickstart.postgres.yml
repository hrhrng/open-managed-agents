# Overlay: use with compose.quickstart.yml and --env-file .env.openma.
services:
  oma-server:
    environment:
      DATABASE_URL: postgres://oma:${OPENMA_POSTGRES_PASSWORD:?Run the Postgres setup wizard}@postgres:5432/oma
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oma
      POSTGRES_DB: oma
      POSTGRES_PASSWORD: ${OPENMA_POSTGRES_PASSWORD:?Run the Postgres setup wizard}
    volumes:
      - openma-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oma -d oma"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  openma-postgres:
